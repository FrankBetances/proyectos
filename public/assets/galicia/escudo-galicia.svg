<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" role="img" aria-label="Escudo de Galicia">
  <!-- Corona Real Cerrada (Timbre) -->
  <path d="M8,11 L6,5 L11,8 L16,3.5 L21,8 L26,5 L24,11 Z" fill="#C8102E"/>
  <path d="M7,11 C7,6.5 11,4.5 16,4.5 C21,4.5 25,6.5 25,11" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="16" y1="1.2" x2="16" y2="4.5" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="14.7" y1="2.3" x2="17.3" y2="2.3" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="7" y="10.2" width="18" height="2.4" rx="1" fill="#F59E0B" stroke="#B45309" stroke-width="0.6"/>
  <!-- Escudo de Azur -->
  <path d="M5,13 H27 V24.5 C27,31.8 22.2,36.8 16,38.5 C9.8,36.8 5,31.8 5,24.5 Z" fill="#0066B3" stroke="#F59E0B" stroke-width="1.4"/>
  <!-- 7 Cruces Recortadas de Plata (3 izq, 3 dcha, 1 jefe) -->
  <g stroke="#F8FAFC" stroke-width="1.15" stroke-linecap="round">
    <!-- Jefe centro -->
    <line x1="16" y1="14.5" x2="16" y2="17.1"/><line x1="14.7" y1="15.8" x2="17.3" y2="15.8"/>
    <!-- Izquierda -->
    <line x1="8.8" y1="15.5" x2="8.8" y2="18.1"/><line x1="7.5" y1="16.8" x2="10.1" y2="16.8"/>
    <line x1="8.5" y1="21.2" x2="8.5" y2="23.8"/><line x1="7.2" y1="22.5" x2="9.8" y2="22.5"/>
    <line x1="9.6" y1="27.0" x2="9.6" y2="29.6"/><line x1="8.3" y1="28.3" x2="10.9" y2="28.3"/>
    <!-- Derecha -->
    <line x1="23.2" y1="15.5" x2="23.2" y2="18.1"/><line x1="21.9" y1="16.8" x2="24.5" y2="16.8"/>
    <line x1="23.5" y1="21.2" x2="23.5" y2="23.8"/><line x1="22.2" y1="22.5" x2="24.8" y2="22.5"/>
    <line x1="22.4" y1="27.0" x2="22.4" y2="29.6"/><line x1="21.1" y1="28.3" x2="23.7" y2="28.3"/>
  </g>
  <!-- Hostia de Plata Radiante -->
  <circle cx="16" cy="20.4" r="2.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.8"/>
  <!-- Cáliz de Oro -->
  <path d="M12.5,23.2 H19.5 C19.3,26.8 17.8,28.5 16,28.5 C14.2,28.5 12.7,26.8 12.5,23.2 Z" fill="#FBBF24" stroke="#B45309" stroke-width="0.6"/>
  <rect x="15" y="28.3" width="2" height="4.2" fill="#FBBF24"/>
  <ellipse cx="16" cy="30.2" rx="2.1" ry="0.9" fill="#F59E0B"/>
  <path d="M12,33.8 C12,32.4 13.8,32 16,32 C18.2,32 20,32.4 20,33.8 Z" fill="#FBBF24" stroke="#B45309" stroke-width="0.6"/>
</svg>
